name: Codebase Telemetry (loc.csv) Auto-Update on Push

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'public/loc.csv'
      - 'meta/loc.csv'
  workflow_dispatch:

jobs:
  update-loc:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Regenerate loc.csv from git log
        run: node scripts/generate-loc.mjs

      - name: Commit and Push Updated loc.csv
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/loc.csv meta/loc.csv data/loc-static.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update loc.csv on push to repo [skip ci]" && git push)
