name: Codebase Telemetry & GitHub Cache Auto-Update on Push

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'public/loc.csv'
      - 'meta/loc.csv'
      - 'data/loc-static.json'
      - 'data/github-cache.json'
  workflow_dispatch:

jobs:
  update-loc:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Regenerate Telemetry and Fetch Latest GitHub Cache
        run: |
          node scripts/generate-loc.mjs
          node scripts/fetch-github-cache.mjs

      - name: Commit and Push Updated Telemetry and Cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/loc.csv meta/loc.csv data/loc-static.json data/github-cache.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto-update telemetry loc and github cache data [skip ci]" && git push)
